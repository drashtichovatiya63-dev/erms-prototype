<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Physique 57 · RequestFlow — Employee Request Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink:#1A1A1A; --ink-2:#45463F; --muted:#8A8B82;
    --surface:#FFFFFF; --bg:#F6F6F2; --line:#E6E6DF; --line-2:#F0F0EA;
    --accent:#14B3AF; --accent-ink:#0C837F; --accent-wash:#E1F6F5;
    --open:#3B6FE0; --open-wash:#E7EDFC;
    --active:#DD8409; --active-wash:#FBF0DB;
    --final:#12986B; --final-wash:#E0F4EC;
    --risk:#C96A05; --breach:#DC2626; --breach-wash:#FCE7E7;
    --shadow:0 1px 2px rgba(26,26,26,.04),0 4px 16px rgba(26,26,26,.05);
    --shadow-lg:0 10px 44px rgba(26,26,26,.15);
    --r:12px; --r-sm:8px;
    --serif:'Cormorant Garamond',Georgia,serif;
    --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--sans);background:var(--bg);color:var(--ink);line-height:1.5;font-size:14px;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;cursor:pointer;border:none;background:none}
  input,select,textarea{font-family:inherit;font-size:14px}
  ::selection{background:var(--accent-wash)}

  /* ---- Top bar ---- */
  .topbar{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .topbar-in{max-width:1200px;margin:0 auto;padding:0 24px;height:62px;display:flex;align-items:center;gap:22px}
  /* Physique 57 wordmark — replace this block with the official logo asset if you have it */
  .brand{display:flex;align-items:center;gap:14px}
  .wm{font-family:var(--serif);font-weight:600;font-size:23px;letter-spacing:.14em;color:var(--ink);white-space:nowrap;text-transform:uppercase}
  .wm .n{color:var(--accent);font-style:italic;letter-spacing:0}
  .brand .div{width:1px;height:26px;background:var(--line)}
  .sys{display:flex;flex-direction:column;line-height:1.15}
  .sys b{font-size:13px;font-weight:600;letter-spacing:-.01em}
  .sys small{font-size:10px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
  .tabs{display:flex;gap:2px;margin-left:6px}
  .tab{padding:7px 13px;border-radius:8px;font-weight:500;color:var(--ink-2);font-size:13.5px;transition:.15s}
  .tab:hover{background:var(--line-2)}
  .tab.active{background:var(--ink);color:#fff}
  .tab .cnt{margin-left:6px;font-family:var(--mono);font-size:11px;opacity:.7}
  .spacer{flex:1}
  .rolebox{display:flex;align-items:center;gap:8px}
  .rolebox label{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
  .sel{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);font-weight:500;font-size:13px}
  .sel:focus{outline:none;border-color:var(--accent)}
  .btn-ghost{padding:7px 11px;border-radius:8px;border:1px solid var(--line);color:var(--ink-2);font-weight:500;font-size:12.5px;background:#fff;transition:.15s}
  .btn-ghost:hover{border-color:var(--muted);color:var(--ink)}

  .wrap{max-width:1200px;margin:0 auto;padding:24px 24px 80px}

  /* ---- Demo banner ---- */
  .demo-banner{max-width:1200px;margin:14px auto 0;padding:0 24px}
  .demo-banner .in{background:var(--ink);color:#fff;border-radius:10px;padding:11px 16px;font-size:12.5px;display:flex;align-items:center;gap:10px}
  .demo-banner b{color:var(--accent)}
  .demo-banner .x{margin-left:auto;color:#9a9a92;font-size:16px;padding:0 4px}
  .demo-banner .x:hover{color:#fff}

  .page-head{margin:6px 0 22px}
  .page-head h1{font-family:var(--serif);font-size:30px;font-weight:600;letter-spacing:.005em;color:var(--ink)}
  .page-head p{color:var(--muted);margin-top:2px;font-size:13.5px;max-width:64ch}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--accent-ink);font-weight:600;margin-bottom:7px}
  .role-chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--accent-ink);background:var(--accent-wash);padding:3px 10px;border-radius:999px;margin-left:10px;vertical-align:middle;letter-spacing:.02em}

  .submit-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:22px;align-items:start}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
  .card-pad{padding:22px}
  .field{margin-bottom:15px}
  .field label{display:block;font-weight:600;font-size:12.5px;margin-bottom:6px;color:var(--ink-2)}
  .field .hint{font-weight:400;color:var(--muted);font-size:11.5px}
  .control{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-sm);background:#fff;color:var(--ink);transition:.15s}
  .control:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-wash)}
  textarea.control{resize:vertical;min-height:92px;line-height:1.55}
  .row-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .channel-pills{display:flex;flex-wrap:wrap;gap:7px}
  .pill{padding:7px 12px;border:1px solid var(--line);border-radius:999px;font-size:12.5px;font-weight:500;color:var(--ink-2);background:#fff;transition:.12s}
  .pill:hover{border-color:var(--muted)}
  .pill.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .pill .dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:6px;vertical-align:middle;background:var(--accent)}
  .pill.on .dot{background:#fff}
  .btn-primary{width:100%;padding:12px;border-radius:var(--r-sm);background:var(--accent);color:#fff;font-weight:600;font-size:14px;transition:.15s}
  .btn-primary:hover{background:var(--accent-ink)}
  .btn-primary:disabled{opacity:.5;cursor:not-allowed}

  /* ---- Triage panel ---- */
  .triage{background:linear-gradient(180deg,#1E1F1A,#161610);border-radius:var(--r);color:#fff;overflow:hidden;position:sticky;top:82px}
  .triage-head{padding:16px 20px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:space-between}
  .triage-head .t{font-weight:600;font-size:13px;display:flex;align-items:center;gap:8px}
  .live-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:pulse 2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(20,179,175,.5)}70%{box-shadow:0 0 0 7px rgba(20,179,175,0)}100%{box-shadow:0 0 0 0 rgba(20,179,175,0)}}
  .triage-head .auto{font-family:var(--mono);font-size:10.5px;color:#8f9088;letter-spacing:.04em}
  .triage-body{padding:18px 20px}
  .triage-empty{color:#9a9b92;font-size:13px;text-align:center;padding:22px 8px;line-height:1.6}
  .verdict{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
  .vbox{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);border-radius:10px;padding:12px}
  .vbox .k{font-size:10.5px;color:#9a9b92;text-transform:uppercase;letter-spacing:.06em;font-weight:600;margin-bottom:5px}
  .vbox .v{font-weight:600;font-size:15px;display:flex;align-items:center;gap:7px}
  .vbox .v .mono{font-family:var(--mono);font-size:13px}
  .trace-title{color:#9a9b92;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;font-weight:600;margin-bottom:8px}
  .kw{display:inline-block;font-family:var(--mono);font-size:11px;padding:3px 8px;border-radius:6px;background:var(--accent-wash);color:var(--accent-ink);margin:0 5px 5px 0;font-weight:500}
  .trace-line{color:#c2c3ba;line-height:1.6;font-size:12px}
  .route-to{margin-top:14px;padding-top:14px;border-top:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:8px;font-size:12.5px;color:#c2c3ba}
  .route-to b{color:#fff}

  .badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap}
  .badge .bd{width:6px;height:6px;border-radius:50%}
  .b-cat{background:var(--accent-wash);color:var(--accent-ink)}
  .b-Open{background:var(--open-wash);color:var(--open)} .b-Open .bd{background:var(--open)}
  .b-Active{background:var(--active-wash);color:var(--active)} .b-Active .bd{background:var(--active)}
  .b-Finalized{background:var(--final-wash);color:var(--final)} .b-Finalized .bd{background:var(--final)}
  .prio{font-family:var(--mono);font-weight:600}
  .prio-Urgent{color:var(--breach)} .prio-High{color:var(--risk)} .prio-Medium{color:var(--ink-2)} .prio-Low{color:var(--muted)}

  .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
  .search{flex:1;min-width:200px;position:relative}
  .search .control{padding-left:34px}
  .search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
  .kanban{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .col-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;padding:0 2px}
  .col-head .l{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px}
  .col-head .c{font-family:var(--mono);font-size:12px;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:6px;padding:1px 7px}
  .col-body{display:flex;flex-direction:column;gap:10px;min-height:60px}
  .tk{background:#fff;border:1px solid var(--line);border-radius:10px;padding:13px 14px;cursor:pointer;transition:.14s;box-shadow:var(--shadow)}
  .tk:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:var(--shadow-lg)}
  .tk-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}
  .tk-id{font-family:var(--mono);font-size:11px;font-weight:500;color:var(--accent-ink)}
  .tk-title{font-weight:600;font-size:13.5px;line-height:1.35;margin-bottom:6px}
  .tk-req{font-size:11.5px;color:var(--muted);margin-bottom:8px}
  .tk-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .tk-sla{font-family:var(--mono);font-size:11px;font-weight:500}
  .sla-ontrack{color:var(--final)} .sla-risk{color:var(--risk)} .sla-breach{color:var(--breach)} .sla-met{color:var(--muted)}
  .col-empty{border:1px dashed var(--line);border-radius:10px;padding:22px;text-align:center;color:var(--muted);font-size:12.5px}

  .scrim{position:fixed;inset:0;background:rgba(26,26,26,.4);backdrop-filter:blur(2px);z-index:60;opacity:0;pointer-events:none;transition:.2s}
  .scrim.show{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;right:0;height:100%;width:min(480px,100%);background:var(--bg);z-index:70;transform:translateX(100%);transition:.28s cubic-bezier(.4,0,.2,1);box-shadow:var(--shadow-lg);display:flex;flex-direction:column}
  .drawer.show{transform:translateX(0)}
  .dr-head{padding:20px 22px;background:#fff;border-bottom:1px solid var(--line);position:relative}
  .dr-close{position:absolute;top:16px;right:18px;width:30px;height:30px;border-radius:8px;color:var(--muted);font-size:18px;display:flex;align-items:center;justify-content:center;transition:.15s}
  .dr-close:hover{background:var(--line-2);color:var(--ink)}
  .dr-id{font-family:var(--mono);font-size:12px;color:var(--accent-ink);font-weight:500;margin-bottom:6px}
  .dr-title{font-size:17px;font-weight:700;letter-spacing:-.01em;padding-right:30px;line-height:1.35}
  .dr-body{flex:1;overflow-y:auto;padding:20px 22px}
  .dr-sec{margin-bottom:22px}
  .dr-sec h4{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;margin-bottom:10px}
  .kv{display:grid;grid-template-columns:112px 1fr;gap:8px 12px;font-size:13px}
  .kv .k{color:var(--muted)}
  .kv .v{font-weight:500}
  .desc-box{background:#fff;border:1px solid var(--line);border-radius:10px;padding:13px;font-size:13px;line-height:1.6;color:var(--ink-2)}
  .log{position:relative;padding-left:20px}
  .log::before{content:"";position:absolute;left:5px;top:4px;bottom:4px;width:2px;background:var(--line)}
  .log-item{position:relative;margin-bottom:14px;font-size:12.5px}
  .log-item::before{content:"";position:absolute;left:-19px;top:3px;width:9px;height:9px;border-radius:50%;background:var(--accent);border:2px solid var(--bg)}
  .log-item .lt{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:1px}
  .dr-foot{padding:16px 22px;background:#fff;border-top:1px solid var(--line);display:flex;gap:10px;flex-wrap:wrap}
  .act{flex:1;min-width:120px;padding:11px;border-radius:8px;font-weight:600;font-size:13px;transition:.15s;text-align:center;border:1px solid transparent}
  .act-primary{background:var(--accent);color:#fff}.act-primary:hover{background:var(--accent-ink)}
  .act-final{background:var(--final);color:#fff}.act-final:hover{filter:brightness(.94)}
  .act-ghost{background:#fff;border-color:var(--line);color:var(--ink-2)}.act-ghost:hover{border-color:var(--muted)}
  .readonly-note{padding:12px 22px;background:#fff;border-top:1px solid var(--line);font-size:12px;color:var(--muted);text-align:center}
  .esc-flag{margin-top:12px;background:var(--breach-wash);border:1px solid #F5C6C6;border-radius:10px;padding:11px 13px;font-size:12.5px;color:var(--breach);display:flex;gap:8px;align-items:flex-start}

  .kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:22px}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow)}
  .kpi .n{font-size:28px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .kpi .l{font-size:12px;color:var(--muted);margin-top:2px;font-weight:500}
  .kpi.warn .n{color:var(--breach)}
  .dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-bottom:22px}
  .chart-row{display:flex;align-items:center;gap:12px;margin-bottom:11px;font-size:12.5px}
  .chart-row .lab{width:96px;color:var(--ink-2);font-weight:500;flex-shrink:0}
  .bar-track{flex:1;height:9px;background:var(--line-2);border-radius:6px;overflow:hidden}
  .bar-fill{height:100%;border-radius:6px;transition:width .5s cubic-bezier(.4,0,.2,1)}
  .chart-row .val{width:26px;text-align:right;font-family:var(--mono);font-size:12px;color:var(--muted)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;padding:9px 12px;border-bottom:1px solid var(--line)}
  td{padding:11px 12px;border-bottom:1px solid var(--line-2)}
  tbody tr{cursor:pointer;transition:.1s}
  tbody tr:hover{background:var(--bg)}
  td .tk-id{font-size:12px}

  .sectionbar{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px}
  .dir-grid{display:grid;grid-template-columns:1.3fr .7fr;gap:22px;align-items:start}
  .emprow-id{font-family:var(--mono);font-size:12px;color:var(--accent-ink);font-weight:500}
  .mgr-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line-2)}
  .mgr-row .d{width:96px;font-weight:600;font-size:12.5px}
  .mgr-row input{flex:1}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:10px;font-size:13px;font-weight:500;box-shadow:var(--shadow-lg);z-index:90;opacity:0;transition:.25s;display:flex;align-items:center;gap:9px}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast .ti{color:var(--accent)}

  @media(max-width:920px){
    .submit-grid,.dash-grid,.dir-grid{grid-template-columns:1fr}
    .kanban{grid-template-columns:1fr}
    .kpis{grid-template-columns:1fr 1fr}
    .triage{position:static}
    .sys,.brand .div{display:none}
  }
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-in">
      <div class="brand">
        <!-- Replace this wordmark with the official Physique 57 logo (<img src="logo.svg" height="26">) if you have the asset -->
        <span class="wm">Physique&nbsp;<span class="n">57</span></span>
        <span class="div"></span>
        <span class="sys"><b>RequestFlow</b><small>Employee Requests</small></span>
      </div>
      <div class="tabs" id="tabs"></div>
      <div class="spacer"></div>
      <div class="rolebox">
        <label>View as</label>
        <select class="sel" id="roleSel"></select>
        <select class="sel" id="empSel" style="display:none"></select>
      </div>
      <button class="btn-ghost" id="seedBtn">Sample data</button>
      <button class="btn-ghost" id="resetBtn">Reset</button>
    </div>
  </div>
  <div class="demo-banner" id="demoBanner">
    <div class="in">
      <span>◆ <b>Demo access control.</b> Switch roles with “View as” to see how each person's view is scoped. In production this is real login — e.g. Salesforce permission sets &amp; queues.</span>
      <button class="x" id="bannerX">×</button>
    </div>
  </div>

  <div class="wrap" id="view"></div>

  <div class="scrim" id="scrim"></div>
  <div class="drawer" id="drawer"></div>
  <div class="toast" id="toast"></div>

<script>
/* ============================================================
   Physique 57 · RequestFlow — Employee Request Management (PoC)
   Single-file, zero-dependency. Data persists in localStorage.
   Roles are a DEMO switcher (no passwords); production uses real auth.
   ============================================================ */
const STORE='requestflow_v2';

/* ---- Rules ---- */
const CATEGORY_RULES={
  HR:['leave','pto','vacation','sick','holiday','onboarding','offboarding','policy','benefit','insurance','appraisal','promotion','resignation','harassment','grievance','referral','offer letter','experience letter','id card','probation','notice period','attendance'],
  IT:['laptop','computer','password','login','log in','vpn','wifi','wi-fi','software','install','outlook','email not','system','server','network','printer','application','app crash','bug','error','hardware','access denied','account locked','2fa','microsoft','google workspace'],
  Payroll:['salary','payslip','pay slip','payroll','reimburse','reimbursement','tax','tds','bonus','incentive','deduction','bank account','ctc','pf','provident fund','arrears','overtime','expense claim'],
  Operations:['facility','facilities','supplies','stationery','seating','desk','cleaning','maintenance','pantry','access card','parking','courier','vendor','housekeeping','ac not','air conditioning','washroom','pest','security guard']
};
const PRIORITY_RULES={
  Urgent:['urgent','asap','immediately','critical','blocked','cannot access',"can't access",'cant access','down','not working','breach','emergency','deadline today','locked out','no access'],
  High:['today','soon','important','high priority','escalate','pending long','waiting for days'],
  Low:['whenever','no rush','low priority','sometime','not urgent','fyi']
};
const SLA_HOURS={Urgent:4,High:8,Medium:24,Low:72};
const DEPT={HR:'People Team',IT:'IT Helpdesk',Payroll:'Finance & Payroll',Operations:'Facilities & Ops',Other:'Triage Desk'};
const PREFIX={HR:'HR',IT:'IT',Payroll:'PY',Operations:'OP',Other:'GN'};
const CHANNELS=['Portal','Email','WhatsApp','SMS','Instagram'];
const DEPTS=['HR','IT','Payroll','Operations'];

/* ---- Roles & permissions ---- */
const ROLES={
  'Employee':          {kind:'employee', tabs:['submit','mine']},
  'HR Manager':        {kind:'manager', dept:'HR',        tabs:['queue','dash']},
  'IT Manager':        {kind:'manager', dept:'IT',        tabs:['queue','dash']},
  'Payroll Manager':   {kind:'manager', dept:'Payroll',   tabs:['queue','dash']},
  'Operations Manager':{kind:'manager', dept:'Operations',tabs:['queue','dash']},
  'CEO':               {kind:'ceo', all:true,             tabs:['queue','dash','directory']},
  'Admin':             {kind:'admin', all:true, manage:true, tabs:['submit','queue','dash','directory']}
};
const TAB_LABEL={submit:'Submit',mine:'My requests',queue:'Queue',dash:'Dashboard',directory:'Directory'};

/* ---- Classifier ---- */
function classify(text){
  const t=(' '+text+' ').toLowerCase(); let best='Other',bestScore=0,matched=[];
  for(const cat in CATEGORY_RULES){const hits=CATEGORY_RULES[cat].filter(kw=>t.includes(kw)); if(hits.length>bestScore){bestScore=hits.length;best=cat;matched=hits;}}
  const confidence=bestScore===0?0:Math.min(0.55+bestScore*0.15,0.98);
  return {category:best,matched,confidence};
}
function detectPriority(text){
  const t=(' '+text+' ').toLowerCase();
  for(const p of ['Urgent','High','Low']){const hit=PRIORITY_RULES[p].find(kw=>t.includes(kw)); if(hit) return {priority:p,kw:hit};}
  return {priority:'Medium',kw:null};
}

/* ---- State ---- */
let state=load();
function load(){try{const raw=localStorage.getItem(STORE); if(raw) return JSON.parse(raw);}catch(e){}
  return {tickets:[],employees:[],counter:0,empCounter:0,managers:{HR:'Priya Sharma',IT:'Rahul Verma',Payroll:'Neha Shah',Operations:'Arjun Nair'},seeded:false};}
function save(){try{localStorage.setItem(STORE,JSON.stringify(state));}catch(e){}}

let ui={role:'Admin',empId:null,tab:'queue',filter:{status:'all',category:'all',q:''},selected:null,
  draft:{empId:'',name:'',email:'',channel:'Portal',subject:'',desc:''}};

/* ---- Helpers ---- */
function role(){return ROLES[ui.role];}
function currentEmployee(){return state.employees.find(e=>e.empId===ui.empId)||state.employees[0]||null;}
function visibleTickets(){
  const r=role();
  if(r.all) return state.tickets;
  if(r.kind==='manager') return state.tickets.filter(t=>t.category===r.dept);
  const emp=currentEmployee(); return emp?state.tickets.filter(t=>t.empId===emp.empId):[];
}
function canEditTicket(tk){const r=role(); if(r.kind==='admin') return true; if(r.kind==='manager') return r.dept===tk.category; return false;}

/* ---- Ticket lifecycle ---- */
function makeTicket(d){
  const cls=classify(d.subject+' '+d.desc), pr=detectPriority(d.subject+' '+d.desc);
  state.counter++; const now=Date.now();
  const id=`${PREFIX[cls.category]}-2026-${String(state.counter).padStart(4,'0')}`;
  return {id,empId:d.empId||null,name:d.name||'Anonymous',email:d.email||'—',channel:d.channel,
    subject:d.subject,desc:d.desc,category:cls.category,matched:cls.matched,confidence:cls.confidence,
    priority:pr.priority,priorityKw:pr.kw,dept:DEPT[cls.category],status:'Open',
    createdAt:now,updatedAt:now,dueAt:now+SLA_HOURS[pr.priority]*3600*1000,finalizedAt:null,escalated:false,
    log:[{ts:now,text:`Request received via ${d.channel}. Auto-classified as ${cls.category} · ${pr.priority} priority. Routed to ${DEPT[cls.category]} (${state.managers[cls.category]||'Triage'}). SLA target: ${SLA_HOURS[pr.priority]}h.`}]};
}
function slaState(tk){if(tk.status==='Finalized') return tk.finalizedAt<=tk.dueAt?'met':'breach';
  const now=Date.now(),total=tk.dueAt-tk.createdAt,left=tk.dueAt-now; if(left<0) return 'breach'; if(left<total*0.25) return 'risk'; return 'ontrack';}
function slaLabel(tk){const s=slaState(tk),left=tk.dueAt-Date.now();
  if(s==='met') return 'SLA met'; if(s==='breach') return tk.status==='Finalized'?'SLA missed':`Overdue ${fmtDur(-left)}`; return `Due in ${fmtDur(left)}`;}
function fmtDur(ms){const m=Math.round(ms/60000); if(m<60) return m+'m'; const h=Math.floor(m/60); if(h<24) return h+'h '+(m%60)+'m'; return Math.floor(h/24)+'d '+(h%24)+'h';}
function fmtTime(ts){const d=new Date(ts),diff=(Date.now()-d)/60000; if(diff<1) return 'just now'; if(diff<60) return Math.round(diff)+'m ago'; if(diff<1440) return Math.round(diff/60)+'h ago'; return d.toLocaleDateString('en-US',{month:'short',day:'numeric'})+', '+d.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});}

function sweepEscalations(){let changed=false;
  state.tickets.forEach(tk=>{if(tk.status!=='Finalized'&&Date.now()>tk.dueAt&&!tk.escalated){tk.escalated=true;tk.updatedAt=Date.now();
    tk.log.unshift({ts:Date.now(),text:`SLA breached — auto-escalated to ${tk.dept} lead (${state.managers[tk.category]||'Manager'}) for priority handling.`});changed=true;}});
  if(changed) save();}
function transition(id,to){const tk=state.tickets.find(t=>t.id===id); if(!tk||!canEditTicket(tk)) return;
  const labels={Open:'moved back to Open',Active:'started — now Active',Finalized:'verified and Finalized'};
  tk.status=to;tk.updatedAt=Date.now(); tk.finalizedAt=to==='Finalized'?Date.now():null;
  tk.log.unshift({ts:Date.now(),text:`Status ${labels[to]} by ${ui.role}.`});
  save();render(); if(ui.selected===id) openDrawer(id); toast(to==='Finalized'?'Request finalized':'Status updated');}

/* ---- Employees ---- */
function addEmployee(name,email,dept){state.empCounter++; const empId=`EMP-${String(state.empCounter).padStart(4,'0')}`;
  state.employees.push({empId,name,email,dept,createdAt:Date.now()}); save(); return empId;}

/* ============================================================ RENDER ============================================================ */
function firstTab(){return role().tabs[0];}
function render(){
  sweepEscalations();
  // role & employee selectors
  const rs=document.getElementById('roleSel');
  if(rs.options.length===0){rs.innerHTML=Object.keys(ROLES).map(r=>`<option value="${r}">${r}</option>`).join('');}
  rs.value=ui.role;
  const es=document.getElementById('empSel');
  if(role().kind==='employee'){es.style.display='';
    es.innerHTML=state.employees.map(e=>`<option value="${e.empId}">${esc(e.name)} · ${e.dept}</option>`).join('')||'<option>No employees</option>';
    if(!ui.empId&&state.employees[0]) ui.empId=state.employees[0].empId; es.value=ui.empId;
  } else es.style.display='none';
  // tabs
  if(!role().tabs.includes(ui.tab)) ui.tab=firstTab();
  const tabsEl=document.getElementById('tabs');
  tabsEl.innerHTML=role().tabs.map(t=>{
    let cnt='';
    if(t==='queue'){const n=visibleTickets().filter(x=>x.status!=='Finalized').length; cnt=n?`<span class="cnt">${n}</span>`:'';}
    if(t==='mine'){const n=visibleTickets().length; cnt=n?`<span class="cnt">${n}</span>`:'';}
    return `<button class="tab ${ui.tab===t?'active':''}" data-tab="${t}">${TAB_LABEL[t]}${cnt}</button>`;}).join('');
  tabsEl.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{ui.tab=b.dataset.tab;render();});
  // body
  const v=document.getElementById('view');
  if(ui.tab==='submit') v.innerHTML=viewSubmit();
  else if(ui.tab==='mine') v.innerHTML=viewMine();
  else if(ui.tab==='queue') v.innerHTML=viewQueue();
  else if(ui.tab==='dash') v.innerHTML=viewDash();
  else if(ui.tab==='directory') v.innerHTML=viewDirectory();
  wire();
}
function roleChip(){const r=role(); let txt=ui.role; if(r.kind==='manager') txt+=` · ${r.dept} only`; if(r.kind==='employee'&&currentEmployee()) txt=`${currentEmployee().name}`;
  return `<span class="role-chip">◆ ${esc(txt)}</span>`;}

function triageInner(hasText,cls,pr){

  return `<div class="verdict">

      <div class="vbox"><div class="k">SLA target</div><div class="v"><span class="mono">${SLA_HOURS[pr.priority]}h</span></div></div>
      <div class="vbox"><div class="k">Confidence</div><div class="v"><span class="mono">${cls.category==='Other'?'low':Math.round(cls.confidence*100)+'%'}</span></div></div>
    </div>
    <div><div class="trace-title">Why this decision</div>

      <div class="trace-line">Matched ${cls.matched.length} keyword${cls.matched.length>1?'s':''} for <b style="color:#fff">${cls.category}</b>${pr.kw?`; priority raised to <b style="color:#fff">${pr.priority}</b> on "<span style="font-family:var(--mono)">${esc(pr.kw)}</span>".`:'.'}</div>`
      :`<div class="trace-line">No category keywords matched yet — this routes to <b style="color:#fff">Triage Desk (Other)</b>. Add detail to sharpen the match.</div>`}</div>
    <div class="route-to">→ Routes to <b>${DEPT[cls.category]} (${esc(state.managers[cls.category]||'Triage')})</b></div>`;
}

function cardHTML(tk,showCat){const s=slaState(tk),cls={ontrack:'sla-ontrack',risk:'sla-risk',breach:'sla-breach',met:'sla-met'}[s];

/* ---- DASHBOARD ---- */
function viewDash(){
  const t=visibleTickets();
  if(!t.length) return emptyState('No data in view','Submit requests or load sample data to see reporting.');
  const open=t.filter(x=>x.status==='Open').length,active=t.filter(x=>x.status==='Active').length,fin=t.filter(x=>x.status==='Finalized').length;
  const breached=t.filter(x=>slaState(x)==='breach').length;
  const finished=t.filter(x=>x.status==='Finalized');
  const avgH=finished.length?Math.round(finished.reduce((a,x)=>a+(x.finalizedAt-x.createdAt),0)/finished.length/3600000*10)/10:0;
  const scope=role().kind==='manager'?role().dept+' department':'All departments';
  const cats=role().all?['HR','IT','Payroll','Operations','Other']:[role().dept];
  const catCounts=cats.map(c=>({c,n:t.filter(x=>x.category===c).length}));
  const maxCat=Math.max(1,...catCounts.map(x=>x.n));
  const chCounts=CHANNELS.map(c=>({c,n:t.filter(x=>x.channel===c).length})).filter(x=>x.n>0);
  const maxCh=Math.max(1,...chCounts.map(x=>x.n));
  const catColor={HR:'#8B5CF6',IT:'#3B6FE0',Payroll:'#12986B',Operations:'#DD8409',Other:'#8A8B82'};
  return `<div class="page-head sectionbar"><div><div class="eyebrow">Reporting · ${scope}</div><h1>Dashboard ${roleChip()}</h1>
    <p>One source of truth that fragmented email and WhatsApp threads never gave you.</p></div><button class="btn-ghost" id="csvBtn">↓ Export CSV</button></div>
  <div class="kpis">
    <div class="kpi"><div class="n">${t.length}</div><div class="l">Total requests</div></div>
    <div class="kpi"><div class="n">${open+active}</div><div class="l">In progress</div></div>
    <div class="kpi"><div class="n">${fin}</div><div class="l">Finalized</div></div>
    <div class="kpi ${breached?'warn':''}"><div class="n">${breached}</div><div class="l">SLA breached</div></div>
    <div class="kpi"><div class="n">${avgH||'—'}${avgH?'h':''}</div><div class="l">Avg resolution</div></div>
  </div>
  <div class="dash-grid">
    <div class="card card-pad"><h4 style="font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;margin-bottom:16px">Requests by department</h4>
      ${catCounts.map(x=>`<div class="chart-row"><div class="lab">${x.c}</div><div class="bar-track"><div class="bar-fill" style="width:${x.n/maxCat*100}%;background:${catColor[x.c]}"></div></div><div class="val">${x.n}</div></div>`).join('')}</div>
    <div class="card card-pad"><h4 style="font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;margin-bottom:16px">Intake by channel</h4>
      ${chCounts.map(x=>`<div class="chart-row"><div class="lab">${x.c}</div><div class="bar-track"><div class="bar-fill" style="width:${x.n/maxCh*100}%;background:var(--accent)"></div></div><div class="val">${x.n}</div></div>`).join('')}</div>
  </div>
  <div class="card"><div style="padding:16px 18px;border-bottom:1px solid var(--line)"><h4 style="font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600">Requests</h4></div>
    <div style="overflow-x:auto"><table><thead><tr><th>ID</th><th>Subject</th><th>Requester</th><th>Dept</th><th>Priority</th><th>Status</th><th>SLA</th></tr></thead><tbody>
      ${t.slice().sort((a,b)=>b.createdAt-a.createdAt).map(tk=>{const s=slaState(tk),cls={ontrack:'sla-ontrack',risk:'sla-risk',breach:'sla-breach',met:'sla-met'}[s];
        return `<tr data-id="${tk.id}"><td><span class="tk-id">${tk.id}</span></td>
          <td style="font-weight:500;max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(tk.subject)}</td>
          <td>${esc(tk.name)}</td><td>${tk.dept}</td><td><span class="prio prio-${tk.priority}" style="font-size:12px">${tk.priority}</span></td>
          <td><span class="badge b-${tk.status}"><span class="bd"></span>${tk.status}</span></td><td><span class="tk-sla ${cls}">${slaLabel(tk)}</span></td></tr>`;}).join('')}
    </tbody></table></div></div>`;
}

  const s=slaState(tk),cls={ontrack:'sla-ontrack',risk:'sla-risk',breach:'sla-breach',met:'sla-met'}[s];
  const editable=canEditTicket(tk);
  const d=document.getElementById('drawer');
  d.innerHTML=`<div class="dr-head"><button class="dr-close" id="drClose">×</button>
      <div class="dr-id">${tk.id}${tk.empId?` · ${tk.empId}`:''}</div>
      <div class="dr-title">${esc(tk.subject)}</div>
      <div style="margin-top:12px;display:flex;gap:7px;flex-wrap:wrap;align-items:center">
        <span class="badge b-${tk.status}"><span class="bd"></span>${tk.status}</span>
        <span class="badge b-cat">${tk.category}</span>
        <span class="tk-sla ${cls}">${slaLabel(tk)}</span></div>
      ${tk.escalated&&tk.status!=='Finalized'?`<div class="esc-flag">⚠ <div><b>Escalated.</b> Breached its ${SLA_HOURS[tk.priority]}h SLA — auto-flagged to ${tk.dept} lead (${esc(state.managers[tk.category]||'Manager')}).</div></div>`:''}</div>
    <div class="dr-body">
      <div class="dr-sec"><h4>Details</h4><div class="kv">
        <div class="k">Requester</div><div class="v">${esc(tk.name)}</div>
        <div class="k">Email</div><div class="v">${esc(tk.email)}</div>
        <div class="k">Channel</div><div class="v">${tk.channel}</div>
        <div class="k">Priority</div><div class="v"><span class="prio prio-${tk.priority}">${tk.priority}</span></div>
        <div class="k">Owned by</div><div class="v">${tk.dept} · ${esc(state.managers[tk.category]||'Triage')}</div>
        <div class="k">Created</div><div class="v">${fmtTime(tk.createdAt)}</div></div></div>
      <div class="dr-sec"><h4>Description</h4><div class="desc-box">${esc(tk.desc)||'<span style="color:var(--muted)">No description.</span>'}</div></div>
      <div class="dr-sec"><h4>Auto-classification</h4><div class="desc-box" style="background:var(--accent-wash);border-color:#BFE8E6">
        Detected <b>${tk.category}</b>${tk.matched.length?` from: ${tk.matched.map(k=>`<span class="kw" style="background:#fff">${esc(k)}</span>`).join(' ')}`:' (no keyword match — sent to Triage Desk).'}</div></div>
      <div class="dr-sec"><h4>Activity log</h4><div class="log">${tk.log.map(l=>`<div class="log-item"><div>${esc(l.text)}</div><div class="lt">${fmtTime(l.ts)}</div></div>`).join('')}</div></div>
    </div>
    ${editable?`<div class="dr-foot">${footActions(tk)}</div>`:`<div class="readonly-note">${role().kind==='ceo'?'CEO view is read-only oversight.':role().kind==='employee'?'You can track this request; your department team will action it.':'This request is owned by another department.'}</div>`}`;
  document.getElementById('scrim').classList.add('show'); d.classList.add('show');
  document.getElementById('drClose').onclick=closeDrawer;
  d.querySelectorAll('[data-to]').forEach(b=>b.onclick=()=>transition(tk.id,b.dataset.to));
}
function footActions(tk){if(tk.status==='Open') return `<button class="act act-primary" data-to="Active">Start work →</button>`;
  if(tk.status==='Active') return `<button class="act act-ghost" data-to="Open">← Move back</button><button class="act act-final" data-to="Finalized">Verify &amp; finalize ✓</button>`;
  return `<button class="act act-ghost" data-to="Active">Reopen</button>`;}
function closeDrawer(){ui.selected=null;document.getElementById('scrim').classList.remove('show');document.getElementById('drawer').classList.remove('show');}

/* ---- CSV ---- */
function exportCSV(){const t=visibleTickets();
  const cols=['ID','EmployeeID','Requester','Email','Channel','Subject','Category','Owner','Priority','Status','Created','Due','SLA'];
  const rows=t.map(x=>[x.id,x.empId||'',x.name,x.email,x.channel,x.subject,x.category,state.managers[x.category]||'',x.priority,x.status,new Date(x.createdAt).toISOString(),new Date(x.dueAt).toISOString(),slaState(x)]);
  const csv=[cols,...rows].map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='requestflow_export.csv';a.click();toast('CSV exported');}

/* ---- Wiring ---- */
function wire(){
  if(ui.tab==='submit'){
    const emp=document.getElementById('f-emp'); if(emp) emp.onchange=e=>{ui.draft.empId=e.target.value; const p=state.employees.find(x=>x.empId===e.target.value); if(p){ui.draft.name=p.name;ui.draft.email=p.email;} render();};
    const bind=(id,k)=>{const el=document.getElementById(id); if(el) el.oninput=e=>{ui.draft[k]=e.target.value; if(k==='subject'||k==='desc') refreshTriage();};};
    bind('f-name','name');bind('f-email','email');bind('f-subject','subject');bind('f-desc','desc');
    document.querySelectorAll('#f-channels .pill').forEach(p=>p.onclick=()=>{ui.draft.channel=p.dataset.ch;document.querySelectorAll('#f-channels .pill').forEach(x=>x.classList.toggle('on',x===p));});
    const sb=document.getElementById('submitBtn'); if(sb) sb.onclick=doSubmit;
  }
  if(ui.tab==='queue'){
    const se=document.getElementById('q-search'); if(se) se.oninput=e=>{ui.filter.q=e.target.value;render();const n=document.getElementById('q-search'); if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length);}};
    const ct=document.getElementById('q-cat'); if(ct) ct.onchange=e=>{ui.filter.category=e.target.value;render();};
  }
  if(ui.tab==='dash'){const cb=document.getElementById('csvBtn'); if(cb) cb.onclick=exportCSV;}
  if(ui.tab==='directory'){
    const ab=document.getElementById('addEmpBtn'); if(ab) ab.onclick=()=>{const n=val('e-name'),em=val('e-email'),dp=val('e-dept'); if(!n){toast('Enter a name');return;} const id=addEmployee(n,em||'—',dp); render(); toast(`Created ${id} · ${n}`);};
    document.querySelectorAll('.mgr-input').forEach(i=>i.onchange=e=>{state.managers[e.target.dataset.dept]=e.target.value;save();toast('Owner updated');});
  }
  document.querySelectorAll('.tk[data-id]').forEach(c=>c.onclick=()=>openDrawer(c.dataset.id));
  document.querySelectorAll('tbody tr[data-id]').forEach(r=>r.onclick=()=>openDrawer(r.dataset.id));
  const si=document.getElementById('seedInline'); if(si) si.onclick=seed;
}
function val(id){const e=document.getElementById(id);return e?e.value.trim():'';}
function refreshTriage(){const d=ui.draft,text=d.subject+' '+d.desc,hasText=text.trim().length>2;
  const panel=document.querySelector('.triage'); if(!panel) return;
  panel.querySelector('.triage-body').innerHTML=triageInner(hasText,classify(text),detectPriority(text));
  const btn=document.getElementById('submitBtn'); if(btn) btn.disabled=!hasText;}
function doSubmit(){const d=ui.draft; if(!(d.subject+d.desc).trim()) return;
  const tk=makeTicket(d); state.tickets.push(tk); save();
  ui.draft={empId:'',name:'',email:'',channel:'Portal',subject:'',desc:''};
  toast(`Request created · ${tk.id}`);
  if(role().kind==='employee') ui.tab='mine'; else ui.tab='queue';
  render(); setTimeout(()=>openDrawer(tk.id),260);}

/* ---- Sample data ---- */
function seed(){
  const H=3600*1000,now=Date.now();
  state={tickets:[],employees:[],counter:0,empCounter:0,managers:{HR:'Priya Sharma',IT:'Rahul Verma',Payroll:'Neha Shah',Operations:'Arjun Nair'},seeded:true};
  const people=[['Ananya Rao','ananya@physique57.com','Front Desk'],['Rohit Mehta','rohit@physique57.com','Instructor'],['Sara Khan','sara@physique57.com','Front Desk'],
    ['Dev Patel','dev@physique57.com','Operations'],['Meera Iyer','meera@physique57.com','Management'],['Karan Singh','karan@physique57.com','HR'],['Nisha Gupta','nisha@physique57.com','Operations']];
  people.forEach(p=>addEmployee(p[0],p[1],p[2]));
  const emps=state.employees;
  const raw=[
    {i:0,channel:'WhatsApp',subject:'Cannot access payroll portal, salary not credited',desc:'My salary this month is not credited and I cannot log in to the payroll portal. Urgent, need this resolved today.',ageH:30},
    {i:1,channel:'Email',subject:'Laptop VPN not working from studio',desc:'My laptop cannot connect to the VPN since morning, blocked from the booking system.',ageH:6},
    {i:2,channel:'Portal',subject:'Apply for 3 days sick leave',desc:'Requesting sick leave for three days next week, please advise on the policy and approval.',ageH:20},
    {i:3,channel:'SMS',subject:'Access card not working at Kemps Corner',desc:'My access card stopped working at the Kemps Corner facility entrance this morning.',ageH:2},
    {i:4,channel:'Instagram',subject:'Reimbursement for client event supplies',desc:'Need reimbursement for stationery and supplies I bought for the member event, expense claim attached.',ageH:50},
    {i:5,channel:'Email',subject:'New instructor onboarding documents',desc:'Please share onboarding and offer letter documents for two new barre instructors joining Monday.',ageH:8},
    {i:6,channel:'WhatsApp',subject:'Pantry supplies vendor not delivering',desc:'The pantry supplies vendor has not delivered this week, can facilities follow up.',ageH:1},
  ];
  raw.forEach(r=>{const e=emps[r.i]; const tk=makeTicket({empId:e.empId,name:e.name,email:e.email,channel:r.channel,subject:r.subject,desc:r.desc});
    tk.createdAt=now-r.ageH*H; tk.updatedAt=tk.createdAt; tk.dueAt=tk.createdAt+SLA_HOURS[tk.priority]*H;
    tk.log=[{ts:tk.createdAt,text:`Request received via ${r.channel}. Auto-classified as ${tk.category} · ${tk.priority}. Routed to ${tk.dept} (${state.managers[tk.category]||'Triage'}). SLA target: ${SLA_HOURS[tk.priority]}h.`}];
    state.tickets.push(tk);});
  const t=state.tickets;
  if(t[1]){t[1].status='Active';t[1].log.unshift({ts:now-3*H,text:'Status started — now Active by IT Manager.'});}
  if(t[2]){t[2].status='Finalized';t[2].finalizedAt=now-14*H;t[2].log.unshift({ts:now-14*H,text:'Status verified and Finalized by HR Manager.'});}
  if(t[5]){t[5].status='Active';t[5].log.unshift({ts:now-4*H,text:'Status started — now Active by HR Manager.'});}
  save(); ui.empId=emps[0].empId; render(); toast('Sample data loaded');
}
function resetAll(){if(!confirm('Clear all data and start fresh?')) return; state={tickets:[],employees:[],counter:0,empCounter:0,managers:{HR:'Priya Sharma',IT:'Rahul Verma',Payroll:'Neha Shah',Operations:'Arjun Nair'},seeded:false}; ui.empId=null; render(); toast('Cleared');}

/* ---- Utils ---- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
let toastTimer; function toast(m){const el=document.getElementById('toast');el.innerHTML=`<span class="ti">✓</span>${esc(m)}`;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2400);}

/* ---- Boot ---- */
document.getElementById('roleSel').onchange=e=>{ui.role=e.target.value; ui.tab=firstTab(); ui.selected=null; closeDrawer(); render();};
document.getElementById('empSel').onchange=e=>{ui.empId=e.target.value; render();};
document.getElementById('seedBtn').onclick=seed;
document.getElementById('resetBtn').onclick=resetAll;
document.getElementById('scrim').onclick=closeDrawer;
document.getElementById('bannerX').onclick=()=>document.getElementById('demoBanner').style.display='none';
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer();});
if(!state.seeded&&!state.tickets.length) seed();
render();
setInterval(()=>{if(!document.hidden){sweepEscalations(); if(ui.tab!=='submit'&&!ui.selected) render();}},60000);
</script>
